name: Offline source checks

on:
  push:
  pull_request:

jobs:
  windows-offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal runtime and test runner
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pip check
      - name: Check public source manifest
        run: python scripts/build_public_snapshot.py --verify .
      - name: Check public aggregate evidence
        run: python scripts/verify_public_evidence.py
      - name: Check command entry points
        run: |
          python scripts/rsi.py --help
          python scripts/research_assistant.py --help
          python scripts/ai_grounding.py --help
          python scripts/rsi.py status
      - name: Run isolated synthetic task
        shell: pwsh
        run: |
          $env:RSI_HOME = Join-Path $env:RUNNER_TEMP 'rsi-offline-smoke'
          python scripts/smoke_offline.py
      - name: Check connected research workflow
        run: |
          python scripts/smoke_public_workflow.py
      - name: Check synthetic evolution and review loop
        run: |
          python scripts/smoke_evolution_loop.py
      - name: Check public task-input protocol and controlled experiments
        run: python scripts/smoke_public_task_input.py
      - name: Check research plan without a model call
        shell: pwsh
        run: |
          $env:RSI_HOME = Join-Path $env:RUNNER_TEMP 'rsi-research-plan'
          python scripts/rsi.py init
          python scripts/research_assistant.py answer --request configs/research/request.example.json
      - name: Run all tests distributed in the public snapshot
        run: |
          python -m pytest -q
      - name: Recheck public source manifest after runtime checks
        run: python scripts/build_public_snapshot.py --verify .

  pi-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked Pi bridge dependencies
        run: npm ci --prefix tools/pi-bridge
      - name: Check Pi bridge contract
        run: npm --prefix tools/pi-bridge test

  synthetic-data-preparation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional data preparation dependencies
        run: python -m pip install -r requirements.txt -r requirements-data.txt pytest
      - name: Check data preflight and rollback guards
        run: python -m pytest -q tests/unit/test_public_data_preflight.py
      - name: Check synthetic data and fixed-task review loop
        run: python scripts/smoke_data_preparation.py

  optional-document-adapter:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional native document adapter
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-paperqa.txt pytest
      - name: Verify installed dependencies
        run: .\.venv\Scripts\python.exe -m pip check
      - name: Test native records and document evidence handoff
        run: .\.venv\Scripts\python.exe -m pytest -q tests/unit/test_public_capabilities.py
